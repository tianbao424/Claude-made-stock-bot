# 初中数学知识点树（北京初三）。见 docs/07-beijing-curriculum.md §5.1。
# bj_weight 是北京中考权重的初始值（0–1），按经验设定，用一段时间后可以调整。
subject: math
nodes:
  - code: M.NUM
    name: 数与式
    bj_weight: 0.35
    children:
      - code: M.NUM.REAL
        name: 实数
        children:
          - {code: M.NUM.REAL.CONCEPT, name: 实数的概念、数轴、相反数与绝对值}
          - {code: M.NUM.REAL.SCI, name: 科学记数法与近似数}
          - {code: M.NUM.REAL.OPS, name: 实数运算（含零指数、负整数指数、特殊角三角函数值）}
          - {code: M.NUM.REAL.COMPARE, name: 实数大小比较与估算}
      - code: M.NUM.POLY
        name: 整式与因式分解
        children:
          - {code: M.NUM.POLY.OPS, name: 整式运算与乘法公式}
          - {code: M.NUM.POLY.FACTOR, name: 因式分解}
          - {code: M.NUM.POLY.EVAL, name: 代数式求值与整体代入}
      - code: M.NUM.FRAC
        name: 分式
        children:
          - {code: M.NUM.FRAC.COND, name: 分式有意义与值为零的条件}
          - {code: M.NUM.FRAC.SIMPLIFY, name: 分式化简求值}
      - code: M.NUM.RAD
        name: 二次根式
        children:
          - {code: M.NUM.RAD.COND, name: 二次根式有意义的条件}
          - {code: M.NUM.RAD.OPS, name: 二次根式化简与运算}

  - code: M.EQ
    name: 方程与不等式
    bj_weight: 0.5
    children:
      - {code: M.EQ.LIN1, name: 一元一次方程}
      - {code: M.EQ.SYS, name: 二元一次方程组}
      - code: M.EQ.QUAD
        name: 一元二次方程
        children:
          - {code: M.EQ.QUAD.SOLVE, name: 一元二次方程的解法}
          - {code: M.EQ.QUAD.DISC, name: 根的判别式}
          - {code: M.EQ.QUAD.VIETA, name: 根与系数的关系}
          - {code: M.EQ.QUAD.PARAM, name: 含参一元二次方程（求参数范围）}
      - {code: M.EQ.FRAC, name: 分式方程（解法与增根）}
      - code: M.EQ.INEQ
        name: 不等式（组）
        children:
          - {code: M.EQ.INEQ.SOLVE, name: 解不等式（组）与数轴表示}
          - {code: M.EQ.INEQ.INT, name: 整数解与含参不等式}
      - code: M.EQ.MODEL
        name: 列方程建模（第 22 题型）
        children:
          - {code: M.EQ.MODEL.WORD, name: 列方程（组）解应用题}
          - {code: M.EQ.MODEL.INEQ, name: 列不等式解应用题}

  - code: M.FUN
    name: 函数
    bj_weight: 0.9
    children:
      - code: M.FUN.BASIC
        name: 函数与坐标系
        children:
          - {code: M.FUN.BASIC.COORD, name: 平面直角坐标系与点的坐标}
          - {code: M.FUN.BASIC.CONCEPT, name: 函数概念、自变量取值范围、函数图象识别}
      - code: M.FUN.LIN
        name: 一次函数
        children:
          - {code: M.FUN.LIN.GRAPH, name: 一次函数的图象与性质}
          - {code: M.FUN.LIN.EXPR, name: 待定系数法求一次函数解析式}
          - {code: M.FUN.LIN.APP, name: 一次函数与方程、不等式及实际应用}
      - code: M.FUN.INV
        name: 反比例函数
        children:
          - {code: M.FUN.INV.GRAPH, name: 反比例函数的图象与性质}
          - {code: M.FUN.INV.K, name: k 的几何意义}
          - {code: M.FUN.INV.INTERSECT, name: 反比例函数与一次函数的交点问题}
      - code: M.FUN.QUAD
        name: 二次函数
        children:
          - {code: M.FUN.QUAD.GRAPH, name: 二次函数图象与系数的关系（开口、对称轴、顶点）}
          - {code: M.FUN.QUAD.EXPR, name: 求二次函数解析式}
          - {code: M.FUN.QUAD.SHIFT, name: 二次函数图象的平移}
          - {code: M.FUN.QUAD.PARAM, name: 含参二次函数与最值}
          - {code: M.FUN.QUAD.EQ, name: 二次函数与方程、不等式的关系}
          - {code: M.FUN.QUAD.APP, name: 二次函数的实际应用}
      - code: M.FUN.MODEL
        name: 函数探究与数据建模（第 25 题型）
        children:
          - {code: M.FUN.MODEL.TABLE, name: 列表、描点、连线与图象性质探究}
          - {code: M.FUN.MODEL.CROSS, name: 跨学科情境中的函数模型}
      - code: M.FUN.SYN
        name: 代数综合（第 26 题型）
        children:
          - {code: M.FUN.SYN.QUAD_PARAM, name: 二次函数含参综合}
          - {code: M.FUN.SYN.EXIST, name: 存在性与任意性问题}
          - {code: M.FUN.SYN.RANGE, name: 取值范围与分类讨论}

  - code: M.GEO
    name: 图形的性质
    bj_weight: 0.8
    children:
      - code: M.GEO.LINE
        name: 相交线与平行线
        children:
          - {code: M.GEO.LINE.ANGLE, name: 对顶角、邻补角、余角与补角}
          - {code: M.GEO.LINE.PARALLEL, name: 平行线的判定与性质}
      - code: M.GEO.TRI
        name: 三角形
        children:
          - {code: M.GEO.TRI.BASIC, name: 三边关系、内角和与外角}
          - {code: M.GEO.TRI.CONG, name: 全等三角形的判定与性质}
          - {code: M.GEO.TRI.ISO, name: 等腰三角形与等边三角形}
          - {code: M.GEO.TRI.RIGHT, name: 直角三角形与勾股定理}
          - {code: M.GEO.TRI.MID, name: 三角形中位线}
          - {code: M.GEO.TRI.BISECT, name: 角平分线与线段垂直平分线的性质}
      - code: M.GEO.QUAD
        name: 四边形
        children:
          - {code: M.GEO.QUAD.PARA, name: 平行四边形}
          - {code: M.GEO.QUAD.SPECIAL, name: 矩形、菱形、正方形}
          - {code: M.GEO.QUAD.POLY, name: 多边形的内角和与外角和}
      - code: M.GEO.CIRCLE
        name: 圆
        children:
          - {code: M.GEO.CIRCLE.CHORD, name: 垂径定理}
          - {code: M.GEO.CIRCLE.ANGLE, name: 圆周角与圆心角}
          - {code: M.GEO.CIRCLE.TANGENT, name: 切线的判定与性质}
          - {code: M.GEO.CIRCLE.POS, name: 点、直线与圆的位置关系}
          - {code: M.GEO.CIRCLE.ARC, name: 弧长与扇形面积}
          - {code: M.GEO.CIRCLE.POLY, name: 正多边形与圆}
      - code: M.GEO.CONSTRUCT
        name: 尺规作图
        children:
          - {code: M.GEO.CONSTRUCT.BASIC, name: 基本作图}
          - {code: M.GEO.CONSTRUCT.REASON, name: 作图的依据与推理}
      - code: M.GEO.PROOF
        name: 命题与证明
        children:
          - {code: M.GEO.PROOF.LOGIC, name: 命题、定理与反证法}
          - {code: M.GEO.PROOF.WRITE, name: 几何证明的规范书写}

  - code: M.TRF
    name: 图形的变化
    bj_weight: 0.6
    children:
      - code: M.TRF.SYM
        name: 轴对称
        children:
          - {code: M.TRF.SYM.AXIS, name: 轴对称图形与轴对称的性质}
          - {code: M.TRF.SYM.SHORTEST, name: 最短路径问题（将军饮马）}
      - {code: M.TRF.TRANS, name: 平移}
      - code: M.TRF.ROT
        name: 旋转
        children:
          - {code: M.TRF.ROT.PROP, name: 旋转的性质}
          - {code: M.TRF.ROT.CENTER, name: 中心对称}
          - {code: M.TRF.ROT.HAND, name: 手拉手模型（旋转构造全等）}
      - code: M.TRF.SIM
        name: 相似
        children:
          - {code: M.TRF.SIM.AA, name: 相似三角形的判定}
          - {code: M.TRF.SIM.PROP, name: 相似的性质（对应线段比、面积比）}
          - {code: M.TRF.SIM.MODEL, name: 相似基本模型（A 字型、8 字型、一线三等角）}
          - {code: M.TRF.SIM.HOMO, name: 位似}
      - code: M.TRF.TRIG
        name: 锐角三角函数
        children:
          - {code: M.TRF.TRIG.DEF, name: 锐角三角函数的定义与特殊角}
          - {code: M.TRF.TRIG.SOLVE, name: 解直角三角形}
          - {code: M.TRF.TRIG.APP, name: 实际应用（仰角俯角、坡度、方向角）}
      - code: M.TRF.VIEW
        name: 投影与视图
        children:
          - {code: M.TRF.VIEW.THREE, name: 三视图}
          - {code: M.TRF.VIEW.NET, name: 立体图形的展开图}

  - code: M.COORD
    name: 图形与坐标
    bj_weight: 0.3
    children:
      - {code: M.COORD.POS, name: 用坐标表示位置}
      - {code: M.COORD.TRF, name: 用坐标表示平移、对称与旋转}

  - code: M.GSYN
    name: 几何综合（第 27 题型）
    bj_weight: 0.7
    children:
      - {code: M.GSYN.INVAR, name: 图形运动中的不变量}
      - {code: M.GSYN.AUX, name: 辅助线构造}
      - {code: M.GSYN.RELATION, name: 线段数量关系的探究与证明}

  - code: M.STAT
    name: 统计
    bj_weight: 0.3
    children:
      - {code: M.STAT.SAMPLE, name: 普查与抽样}
      - {code: M.STAT.CHART, name: 统计图表（扇形、条形、折线、频数分布直方图）}
      - {code: M.STAT.MEASURE, name: 统计量（平均数、中位数、众数、方差）}
      - {code: M.STAT.ESTIMATE, name: 用样本估计总体}

  - code: M.PROB
    name: 概率
    bj_weight: 0.2
    children:
      - {code: M.PROB.EVENT, name: 随机事件}
      - {code: M.PROB.CALC, name: 列表法与树状图求概率}
      - {code: M.PROB.FREQ, name: 用频率估计概率}

  - code: M.PRAC
    name: 综合与实践
    bj_weight: 0.6
    children:
      - {code: M.PRAC.OPT, name: 方案优化与逻辑推理（第 16 题型）}
      - code: M.PRAC.NEWDEF
        name: 新定义（第 28 题型）
        children:
          - {code: M.PRAC.NEWDEF.CIRCLE, name: 坐标系中结合圆的新定义}
          - {code: M.PRAC.NEWDEF.FUNC, name: 函数类新定义}
          - {code: M.PRAC.NEWDEF.GEO, name: 几何类新定义}
      - {code: M.PRAC.CROSS, name: 跨学科与项目式问题}
