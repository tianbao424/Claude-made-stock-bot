[project]
name = "xuetou"
version = "0.1.0"
description = "学透：北京初三数理错题闭环（家庭自用）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "openai>=1.40",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "qrcode>=7.4",
    "playwright>=1.45",
    "sympy>=1.12",
    "pypdfium2>=4.30",
]

[dependency-groups]
dev = ["pytest>=8.2", "pymupdf>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
